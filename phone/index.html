<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>KartPad Tilt Test</title>
<style>
  :root { color-scheme: dark; --bg: #15171d; --card: #20242c; --text: #f2f3f5; --dim: #9aa0ab; --accent: #f2b51e; }
  body { margin: 0; padding: max(16px, env(safe-area-inset-top)) 16px 24px; background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p { margin: 6px 0; color: var(--dim); }
  .card { background: var(--card); border-radius: 14px; padding: 14px; margin: 12px 0; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 99px; padding: 12px 22px; background: var(--accent); color: #111; margin: 4px 6px 4px 0; }
  button:disabled { opacity: .4; }
  code { font-size: 13px; color: var(--text); word-break: break-all; }
  #bar { height: 18px; background: #0d0f13; border-radius: 9px; position: relative; overflow: hidden; margin-top: 8px; }
  #fill { position: absolute; top: 0; bottom: 0; left: 50%; width: 0; background: var(--accent); }
  .ok { color: #30b85c; } .bad { color: #e5484d; }
</style>
</head>
<body>
<h1>KartPad tilt test</h1>
<p>Prototype for phone controllers over WebRTC. Nothing is installed.</p>

<div class="card">
  <div>Secure page: <b id="secure"></b> · Mac: <code id="mac"></code></div>
  <div id="status">Preparing…</div>
  <button id="join" disabled>1. Connect to the Mac</button>
  <button id="tilt" disabled>2. Allow tilt</button>
  <button id="center" disabled>Recenter</button>
  <button id="invert" disabled>Invert</button>
</div>

<div class="card">
  <div>Tilt: <b id="angle">–</b> → steer <b id="steer">0</b></div>
  <div id="bar"><div id="fill"></div></div>
  <p id="raw"></p>
</div>

<div class="card">
  <div>WebRTC data channel (unordered, no resends)</div>
  <p id="rtt">not connected</p>
</div>

<script>
"use strict";
// Round-trip statistics, as in the baseline page.
class RoundTrips {
  constructor() { this.sent = new Map(); this.rtts = []; this.lost = 0; this.count = 0; }
  stamp(seq) { this.sent.set(seq, performance.now()); }
  answer(seq) {
    const t = this.sent.get(seq);
    if (t === undefined) return;
    this.sent.delete(seq);
    this.rtts.push(performance.now() - t);
    if (this.rtts.length > 1200) this.rtts.shift();
    this.count++;
  }
  sweep() {
    const now = performance.now();
    for (const [seq, t] of this.sent) if (now - t > 1000) { this.sent.delete(seq); this.lost++; }
  }
  summary() {
    this.sweep();
    if (!this.rtts.length) return "no replies yet";
    const s = [...this.rtts].sort((a, b) => a - b);
    const at = (q) => s[Math.min(s.length - 1, Math.floor(q * s.length))].toFixed(1);
    const total = this.count + this.lost;
    return `round trip: median ${at(0.5)} ms · 95% ${at(0.95)} ms · 99% ${at(0.99)} ms · worst ${s[s.length - 1].toFixed(1)} ms` +
           ` · lost ${(100 * this.lost / Math.max(1, total)).toFixed(1)}% of ${total}`;
  }
}

const $ = (id) => document.getElementById(id);
const fragment = new URLSearchParams(location.hash.slice(1));
const mac = fragment.get("mac") || "";
const key = fragment.get("k") || "";
const macOrigin = "http://" + mac;
$("secure").textContent = window.isSecureContext ? "yes" : "no";
$("secure").className = window.isSecureContext ? "ok" : "bad";
$("mac").textContent = mac || "(missing: scan the code on the Mac)";
const status = (text) => { $("status").textContent = text; };
const b64url = (s) => btoa(unescape(encodeURIComponent(s))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");

// ---- WebRTC: the offer is ready before the tap, so the tap can open the helper tab at once
// (a tab opened after waiting would count as a pop-up and be blocked).
const pc = new RTCPeerConnection({iceServers: []});
const dc = pc.createDataChannel("pad", {ordered: false, maxRetransmits: 0});
let offer = null;
const trips = new RoundTrips();
let seq = 0;

async function prepare() {
  await pc.setLocalDescription(await pc.createOffer());
  await new Promise((resolve) => {
    if (pc.iceGatheringState === "complete") return resolve();
    pc.addEventListener("icegatheringstatechange", () => pc.iceGatheringState === "complete" && resolve());
    setTimeout(resolve, 3000);
  });
  offer = pc.localDescription.sdp;
  const candidates = (offer.match(/a=candidate/g) || []).length;
  status(`Ready (${candidates} network candidate${candidates === 1 ? "" : "s"}). Tap Connect.`);
  $("join").disabled = !mac || !key;
}
prepare().catch((e) => status("Couldn't prepare WebRTC: " + e));

$("join").onclick = () => {
  const helper = window.open(`${macOrigin}/helper#k=${key}&o=${b64url(offer)}`, "kartpad-helper");
  status(helper ? "Linking through the Mac… (a tab opens and closes)" : "The helper tab was blocked as a pop-up.");
};

window.addEventListener("message", async (event) => {
  if (event.origin !== macOrigin || !event.data || event.data.t !== "answer") return;
  status("Got the Mac's answer. Connecting…");
  try { await pc.setRemoteDescription({type: "answer", sdp: event.data.sdp}); }
  catch (e) { status("Answer refused: " + e); }
});

pc.addEventListener("connectionstatechange", () => status("Connection: " + pc.connectionState));
dc.onopen = () => {
  status("Connected over WebRTC. Tap Allow tilt.");
  $("tilt").disabled = false;
  setInterval(() => {
    if (dc.readyState !== "open") return;
    seq = (seq + 1) % 65536;
    trips.stamp(seq);
    dc.send(JSON.stringify({t: "ping", s: seq, steer}));
  }, 50);
  setInterval(() => {
    $("rtt").textContent = trips.summary();
    if (dc.readyState === "open") dc.send(JSON.stringify({t: "stats", text: trips.summary()}));
  }, 1000);
};
dc.onmessage = (event) => {
  const m = JSON.parse(event.data);
  if (m.t === "pong") trips.answer(m.s);
};

// ---- Tilt: hold the phone sideways like a steering wheel. Gravity in the screen's own plane gives
// the wheel angle, whichever way the phone is turned.
let steer = 0, center = 0, invert = 1;
const MAX_ANGLE = 35;  // degrees of wheel turn for a full lock
function onMotion(event) {
  const g = event.accelerationIncludingGravity;
  if (!g || g.x == null) return;
  const a = ((screen.orientation && screen.orientation.angle) || window.orientation || 0) * Math.PI / 180;
  const sx = g.x * Math.cos(a) + g.y * Math.sin(a);
  const sy = -g.x * Math.sin(a) + g.y * Math.cos(a);
  const angle = Math.atan2(sx, Math.abs(sy) < 1e-6 ? 1e-6 : -sy) * 180 / Math.PI;
  const turned = invert * (angle - center);
  steer = Math.round(Math.max(-1, Math.min(1, turned / MAX_ANGLE)) * 127);
  $("angle").textContent = angle.toFixed(1) + "°";
  $("steer").textContent = steer;
  $("fill").style.left = (steer < 0 ? 50 + steer / 127 * 50 : 50) + "%";
  $("fill").style.width = Math.abs(steer / 127 * 50) + "%";
  $("raw").textContent = `gravity x ${g.x.toFixed(2)} y ${g.y.toFixed(2)} z ${(g.z || 0).toFixed(2)} · screen angle ${a * 180 / Math.PI}°`;
  lastAngle = angle;
}
let lastAngle = 0;
$("tilt").onclick = async () => {
  try {
    if (typeof DeviceMotionEvent !== "undefined" && typeof DeviceMotionEvent.requestPermission === "function") {
      const answer = await DeviceMotionEvent.requestPermission();
      if (answer !== "granted") { status("Tilt permission: " + answer); return; }
    }
    window.addEventListener("devicemotion", onMotion);
    status("Tilt on. Hold the phone sideways and turn it like a wheel.");
    $("center").disabled = $("invert").disabled = false;
  } catch (e) { status("Tilt failed: " + e); }
};
$("center").onclick = () => { center = lastAngle; };
$("invert").onclick = () => { invert = -invert; };
</script>
</body>
</html>
